<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pelanggan - Cafeteria</title>
    <link rel="stylesheet" href="../../asset/1.css">
</head>
<body>

    <nav class="navbar">
        <a href="beranda.html" class="logo">Cafetaria</a>
        <div class="menu-toggle" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="beranda.html">Beranda</a></li>
            <li><a href="kategori.html">Kategori</a></li>
            <li><a href="produk.html">Produk</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="kontak.html">Kontak</a></li>

            <li><a href="loginpelanggan.html" class="active">Login Pelanggan</a></li>
            <li><a href="loginuser.html">Login Admin</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="form-container">
            <h2 style="text-align: center; margin-bottom: 20px;">Login Pelanggan</h2>
            <!-- Simulasi redirect ke dashboard pelanggan menggunakan javascript -->
            <form action="../pelanggan/dashboardpelanggan.html" method="GET">
                <div class="form-group">
                    <label for="username">Username / Email</label>
                    <input type="text" id="username" required placeholder="Masukkan username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Masukkan password">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Masuk</button>
            </form>
            <p style="text-align: center; margin-top: 20px; font-size: 14px;">
                Belum punya akun? <a href="registerpelanggan.html" style="color: var(--primary); font-weight: bold; text-decoration: none;">Daftar di Sini</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Cafetaria WEB UMKM. All Rights Reserved.</p>
    </footer>

    <script src="../../asset/1.js"></script>
</body>
