<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Cafeteria</title>
    <link rel="stylesheet" href="../../asset/1.css">
</head>
<body>

    <nav class="navbar">
        <a href="beranda.html" class="logo">Cafetaria</a>
        <div class="menu-toggle" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="beranda.html">Beranda</a></li>
            <li><a href="kategori.html">Kategori</a></li>
            <li><a href="produk.html">Produk</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="kontak.html">Kontak</a></li>
            <li><a href="legalitas.html">Legalitas</a></li>
            <li><a href="loginpelanggan.html">Login Pelanggan</a></li>
            <li><a href="loginuser.html">Login Admin</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="form-container" style="max-width: 450px;">
            <h2 style="text-align: center; margin-bottom: 20px;">Daftar Akun Baru</h2>
            <form action="loginpelanggan.html" method="GET" onsubmit="alert('Registrasi Berhasil! Silakan Login.');">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" required placeholder="Nama lengkap Anda">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="contoh@email.com">
                </div>
                <div class="form-group">
                    <label for="telp">No. Telepon</label>
                    <input type="tel" id="telp" required placeholder="08xxxxxxxxx">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Buat password baru">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Daftar Sekarang</button>
            </form>
            <p style="text-align: center; margin-top: 20px; font-size: 14px;">
                Sudah punya akun? <a href="loginpelanggan.html" style="color: var(--primary); font-weight: bold; text-decoration: none;">Login di Sini</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Cafetaria WEB UMKM. All Rights Reserved.</p>
    </footer>

    <script src="../../asset/1.js"></script>
</body>
